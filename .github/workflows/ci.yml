name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    # @SpringBootTest, @DataJpaTest(replace = NONE)가 실제 PostgreSQL을 쓰므로 서비스 컨테이너로 띄운다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hosun
          POSTGRES_USER: hosun
          POSTGRES_PASSWORD: hosun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hosun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/hosun
      DB_USERNAME: hosun
      DB_PASSWORD: hosun
      # JWT_SECRET은 build.gradle의 test 태스크가 무작위로 넣어 준다.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test