name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나씩 순서대로 실행한다. (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR 이미지 이름은 소문자여야 한다.
  IMAGE: ghcr.io/1hosun-ton/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EC2가 t3(x86)이므로 linux/amd64로 빌드한다. 테스트는 CI(PR)에서 이미 통과한 상태다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,SHA
          command_timeout: 15m
          script: |
            set -e
            mkdir -p ~/app && cd ~/app

            # 배포 설정 파일은 이번 커밋 기준으로 받아 온다. (.env는 서버에만 있고 덮어쓰지 않는다)
            BASE=https://raw.githubusercontent.com/1Hosun-ton/backend/$SHA/deploy
            curl -fsSL $BASE/docker-compose.yml -o docker-compose.yml
            curl -fsSL $BASE/Caddyfile -o Caddyfile

            test -f .env || { echo "~/app/.env 가 없습니다. deploy/.env.example을 참고해 먼저 만들어 주세요."; exit 1; }

            # 이번 커밋의 이미지로 정확히 배포한다. (latest가 아니라 SHA 태그)
            export IMAGE_TAG=$SHA

            # 패키지가 private이어도 pull할 수 있게 이번 job의 임시 토큰으로 로그인했다가 바로 로그아웃한다.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker logout ghcr.io

            docker compose up -d

            # Caddyfile이 바뀌었을 수 있으니 다시 읽게 한다. (컨테이너 재시작 없이 무중단 반영)
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

            # 앱이 실제로 응답할 때까지 최대 150초 기다린다. 실패하면 로그를 남기고 배포를 실패로 처리한다.
            for i in $(seq 1 30); do
              if docker compose exec -T caddy wget -q -O /dev/null http://app:8080/v3/api-docs; then
                echo "앱 응답 확인 ($SHA)"
                docker image prune -f
                docker compose ps
                exit 0
              fi
              sleep 5
            done

            echo "앱이 150초 안에 응답하지 않았습니다."
            docker compose ps
            docker compose logs --tail 100 app
            exit 1