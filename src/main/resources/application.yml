spring:
    application:
        name: 1hosun-backend
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/hosun}
        username: ${DB_USERNAME:hosun}
        password: ${DB_PASSWORD:hosun}
    jpa:
        hibernate:
            ddl-auto: validate    
        open-in-view: false
        properties:
            hibernate:
                jdbc:
                    time_zone: Asia/Seoul
    flyway:
        enabled: true
        locations: classpath:db/migration
jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 14d
# 인사이트 문장 생성용 LLM. 키가 없으면 AI 대신 규칙 기반 문장으로 응답한다.
gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout: 15s