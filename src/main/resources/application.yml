spring:
    application:
        name: 1hosun-backend
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/hosun}
        username: ${DB_USERNAME:hosun}
        password: ${DB_PASSWORD:hosun}
    jpa:
        hibernate:
            ddl-auto: validate    
        open-in-view: false
        properties:
            hibernate:
                jdbc:
                    time_zone: Asia/Seoul
    flyway:
        enabled: true
        locations: classpath:db/migration